
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comparador de daño de armas de PUBG Mobile.">
    <title>PUBGM Wiki | Comparador de armas</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#">PUBGM<span>WIKI</span></a>
        <nav>
            <a href="#comparador">Comparador</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <p class="eyebrow">BASE DE DATOS</p>
                <h1>PUBG MOBILE</h1>
                <p>Compará el daño de dos armas según la distancia y la zona de impacto.</p>
            </div>
        </section>

        <section class="comparison-section" id="comparador">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">HERRAMIENTA</p>
                    <h2>Comparador de armas</h2>
                </div>
                <span id="data-status" class="status">Cargando datos...</span>
            </div>

            <div class="comparison-grid">
                <section class="weapon-card" id="weapon-card-1">
                    <div class="card-heading">
                        <span class="weapon-number">01</span>
                        <h3>Arma izquierda</h3>
                    </div>

                    <div class="filters">
                        <div class="filter-group">
                            <label for="weapon-search-1">Buscar arma</label>
                            <input
                                type="search"
                                id="weapon-search-1"
                                placeholder="Ej. M416, AKM, AWM..."
                                autocomplete="off"
                            >
                        </div>

                        <div class="filter-group">
                            <label for="distance-filter-1">Distancia</label>
                            <select id="distance-filter-1"></select>
                        </div>
                    </div>

                    <div class="weapon-selector">
                        <div class="selector-heading">
                            <span>Seleccionar arma</span>
                            <span id="results-count-1">0</span>
                        </div>
                        <div id="weapon-list-1" class="weapon-list"></div>
                    </div>

                    <div class="damage-panel">
                        <div id="weapon-detail-1" class="weapon-detail"></div>
                    </div>
                </section>

                <section class="weapon-card" id="weapon-card-2">
                    <div class="card-heading">
                        <span class="weapon-number">02</span>
                        <h3>Arma derecha</h3>
                    </div>

                    <div class="filters">
                        <div class="filter-group">
                            <label for="weapon-search-2">Buscar arma</label>
                            <input
                                type="search"
                                id="weapon-search-2"
                                placeholder="Ej. M416, AKM, AWM..."
                                autocomplete="off"
                            >
                        </div>

                        <div class="filter-group">
                            <label for="distance-filter-2">Distancia</label>
                            <select id="distance-filter-2"></select>
                        </div>
                    </div>

                    <div class="weapon-selector">
                        <div class="selector-heading">
                            <span>Seleccionar arma</span>
                            <span id="results-count-2">0</span>
                        </div>
                        <div id="weapon-list-2" class="weapon-list"></div>
                    </div>

                    <div class="damage-panel">
                        <div id="weapon-detail-2" class="weapon-detail"></div>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>PUBGM WIKI — Comparador de daño de armas.</p>
    </footer>
</body>
</html>
